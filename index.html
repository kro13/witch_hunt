<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="app">
      <header class="masthead">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="lede" id="lede"></p>
      </header>

      <main class="layout">
        <section class="stage" id="stage">
          <div class="board-frame">
            <div class="rank-labels" id="ranks" aria-hidden="true"></div>
            <div class="board-stack">
              <div class="board" id="board" role="grid"></div>
              <div class="file-labels" id="files" aria-hidden="true"></div>
            </div>
            <div id="overlay" class="overlay" hidden>
              <div class="overlay-card" role="status">
                <p class="overlay-kicker" id="overlay-kicker"></p>
                <h2 id="overlay-title"></h2>
                <p id="overlay-body"></p>
                <button type="button" class="btn" id="overlay-restart"></button>
              </div>
            </div>
          </div>
          <p class="hint" id="move-hint"></p>
        </section>

        <aside class="dossier">
          <section class="panel status-panel">
            <h2 class="panel-title" id="panel-watch"></h2>
            <p class="turn-line">
              <span id="watch-prefix"></span>
              <strong id="turn-now">1</strong>
              <span class="muted" id="watch-of"></span>
              <strong id="turn-max">25</strong>
            </p>
            <p class="stay-line" id="stay-line"></p>
            <p class="pulse-line" id="pulse-line"></p>
          </section>

          <section class="panel compass-panel">
            <h2 class="panel-title" id="panel-bearing"></h2>
            <div class="compass" id="compass">
              <svg viewBox="0 0 120 120" role="img">
                <circle class="compass-ring" cx="60" cy="60" r="46" />
                <circle class="compass-hub" cx="60" cy="60" r="6" />
                <g class="compass-points">
                  <text data-dir="N" x="60" y="18" text-anchor="middle"></text>
                  <text data-dir="NE" x="98" y="32" text-anchor="middle"></text>
                  <text data-dir="E" x="112" y="64" text-anchor="middle"></text>
                  <text data-dir="SE" x="98" y="96" text-anchor="middle"></text>
                  <text data-dir="S" x="60" y="112" text-anchor="middle"></text>
                  <text data-dir="SW" x="22" y="96" text-anchor="middle"></text>
                  <text data-dir="W" x="8" y="64" text-anchor="middle"></text>
                  <text data-dir="NW" x="22" y="32" text-anchor="middle"></text>
                </g>
                <polygon id="compass-needle" class="needle" points="60,22 64,60 60,66 56,60" />
              </svg>
              <p class="compass-caption" id="compass-caption"></p>
            </div>
          </section>

          <section class="panel journal-panel">
            <h2 class="panel-title" id="panel-journal"></h2>
            <ol class="journal" id="journal" aria-live="polite"></ol>
          </section>

          <details class="panel rules-panel">
            <summary id="rules-title"></summary>
            <ul id="rules-list"></ul>
          </details>

          <details class="panel settings-panel">
            <summary id="panel-instruments"></summary>
            <div class="fields">
              <label>
                <span id="label-board-size"></span>
                <input id="board-size" type="number" min="3" max="15" value="5" />
              </label>
              <label>
                <span id="label-max-turns"></span>
                <input id="max-turns" type="number" min="1" max="99" value="25" />
              </label>
            </div>
            <label class="check">
              <input id="scent-toggle" type="checkbox" checked />
              <span id="label-scent"></span>
            </label>
            <label class="check">
              <input id="track-toggle" type="checkbox" />
              <span id="label-track"></span>
            </label>
            <label class="check">
              <input id="slow-toggle" type="checkbox" />
              <span id="label-slow"></span>
            </label>
            <label class="check">
              <input id="debug-toggle" type="checkbox" />
              <span id="label-debug"></span>
            </label>
            <button type="button" class="btn btn-ghost" id="restart"></button>
          </details>
        </aside>
      </main>
    </div>
    <script type="module" src="./dist/index.js"></script>
  </body>
</html>
